name: CodeQL

# 정적 보안 분석. 이 저장소는 **메일 서버**라 취약점의 영향 범위가 일반 앱보다 넓다 —
# 파서 하나가 인터넷에서 오는 바이트를 직접 먹고, 인증 판정 하나가 남의 메일함을 가른다.
# 사람 리뷰가 놓치는 계열(주입·경로 조작·안전하지 않은 정규식·프로토타입 오염)을 기계가 훑는다.
#
# ★왜 주기 실행도 두는가: CodeQL 규칙은 계속 갱신된다. 코드가 그대로여도 **새 규칙이 옛
# 코드에서 문제를 찾는다.** 푸시 때만 돌리면 그 발견을 영영 못 본다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 03:17 UTC. 정각을 피하는 이유는 GitHub 쪽 스케줄 혼잡을 피하기 위해서다.
    - cron: "17 3 * * 1"
  # 손으로 돌릴 수 있어야 한다 — 인프라 쪽 변화(러너 이미지·서비스 컨테이너)로
  # 깨지는 것은 코드 변경 없이 일어나고, 그때 재현할 방법이 없으면 진단이 막힌다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 결과를 Security 탭에 올리려면 이 권한이 필요하다. 잡 단위로만 준다.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 체크아웃이 남기는 자격증명을 `.git/config` 에 두지 않는다. 이 잡의 어떤
          # 단계도 그 토큰으로 밖에 나가지 않는다 — 트리에 두면 러너에서 도는
          # 코드가 집을 수 있는 것만 남는다.
          persist-credentials: false

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # 테스트 경로 제외 — 이유는 그 파일 안에 적었다.
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended: 기본 질의 묶음보다 넓다. 오탐이 조금 늘지만, 이 저장소는
          # 신뢰할 수 없는 입력을 직접 파싱하는 코드가 대부분이라 넓은 쪽이 맞다.
          queries: security-extended

      # ★빌드 단계가 없다. 이 저장소는 트랜스파일하지 않고 `.ts`를 그대로 실행하므로
      # CodeQL이 소스를 직접 읽으면 된다(autobuild를 부르면 할 일이 없어 헛돈다).
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"

  # **브랜치 규칙이 거는 이름은 이것 하나다.** 잡 이름을 규칙에 직접 적으면 이름이
  # 바뀌는 날 그 체크는 "존재하지 않는 체크" 가 되고, 보호는 조용히 사라진다.
  #
  # ⚠️ 이 체크가 묻는 것은 "분석이 돌았는가" 이지 "경고가 없는가" 가 아니다. 경고는
  # Security 탭에 쌓이고 머지를 막지 않는다. 여기서 막는 것은 질의가 깨져 아무것도
  # 훑지 않은 채로 초록이 되는 경우다.
  codeql:
    name: codeql
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 분석이 돌았는가
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          echo "analyze: $RESULT"
          test "$RESULT" = "success" \
            || { echo "::error::CodeQL 분석이 끝까지 돌지 않았다 ($RESULT)"; exit 1; }
