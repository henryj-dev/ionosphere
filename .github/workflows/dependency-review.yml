name: Dependency review

# PR이 의존성을 **추가·변경**할 때만 의미가 있는 검사다.
#
# ★이 저장소에서 특히 중요한 이유: 규약이 "런타임 의존성 0, npm은 pg·mysql2만"이다
# (`scripts/lint.ts`가 import 지정자를 검사해 강제한다). 그런데 린터가 보는 것은 **소스의
# import**이고, `package.json`에 패키지가 늘어나는 것 자체는 못 본다. 이 워크플로가 그 빈틈을
# 메운다 — 사람이 "이거 하나쯤" 하고 넣는 순간 PR에서 눈에 띈다.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # 알려진 취약점이 있는 의존성이 들어오면 PR을 막는다.
          fail-on-severity: moderate
          # 라이선스는 막지 않고 **주석으로 알린다** — MIT 저장소에 GPL 계열이 섞여 들어오는
          # 것을 조용히 지나치지 않되, 판단은 사람이 한다.
          comment-summary-in-pr: on-failure
