name: CI

# 공개 저장소용 CI. 비공개 저장소의 것과 **의도적으로 다르다**.
#
# ★왜 GitHub 호스티드만 쓰는가: 비공개 쪽은 사내 러너를 쓸 수 있지만, 공개 저장소에서 같은
# 설정을 쓰면 **누구든 PR 하나로 그 러너에서 임의 코드를 실행**한다(fork PR의 워크플로는 PR
# 브랜치의 정의로 돈다). 시크릿이 없어도 러너의 네트워크 위치 자체가 자산이다.
#
# ★왜 배포 워크플로가 없는가: 배포 대상·경로는 공개 대상이 아니다. 이 스냅샷은 "이 코드가
# 무엇인가"만 담고 "우리가 어디에 올리는가"는 담지 않는다.

on:
  push:
    branches: [main]
  pull_request:
  # 손으로 돌릴 수 있어야 한다 — 인프라 쪽 변화(러너 이미지·서비스 컨테이너)로
  # 깨지는 것은 코드 변경 없이 일어나고, 그때 재현할 방법이 없으면 진단이 막힌다.
  workflow_dispatch:

# ★`push`를 main으로 제한한 이유: 같은 저장소의 브랜치에 푸시하고 PR을 열면 push와
# pull_request가 **둘 다** 걸려 같은 커밋을 두 번 검사한다. 공개 저장소에서 그 낭비는
# 그대로 남의 대기 시간이 된다.

# 최소 권한. 이 워크플로는 코드를 읽기만 한다 — 기본값(저장소 설정에 따라 쓰기까지)에
# 기대지 않고 명시한다. 공개 저장소에서 토큰 권한은 공격 표면이다.
permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 전체 스위트가 4~8분이다. 멈춘 테스트가 6시간 기본값을 다 태우지 않게 상한을 둔다.
    timeout-minutes: 25
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 봐야 원인이 "그 버전만"인지 알 수 있다.
      fail-fast: false
      matrix:
        # 24 = package.json engines의 하한(LTS). 26 = 현재 릴리스.
        # ★두 버전을 다 도는 이유: 이 저장소는 `.ts`를 **타입 스트리핑으로 직접 실행**하고
        # `node:sqlite`를 쓴다. 둘 다 아직 메이저마다 동작이 움직이는 영역이라, 한 버전만
        # 검사하면 "우리 머신에서는 되는데" 상태가 조용히 생긴다.
        node: ["24", "26"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MySQL이 없으면 mysql.test.ts가 한 번도 돌지 않는다. 4방언 실연결 계약이 문서상
      # 보장인데 한 방언만 자동 검증이 없으면 그 보장은 사람 기억에 의존하게 된다.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ionosphere
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IONOSPHERE_TEST_PG_URL: postgres://postgres:test@localhost:5432/postgres
      IONOSPHERE_TEST_MYSQL_URL: mysql://root:test@localhost:3306/ionosphere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 체크아웃이 남기는 자격증명을 `.git/config` 에 두지 않는다. 이 잡의 어떤
          # 단계도 그 토큰으로 밖에 나가지 않는다 — 트리에 두면 러너에서 도는
          # 코드가 집을 수 있는 것만 남는다.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # ★`npm ci`다(`npm install`이 아니라). 락파일과 다른 트리를 조용히 만들지 않는다.
      - run: npm ci
      # 린터가 규약(.ts 확장자·import type·npm 화이트리스트·패키지 순환·엔진 순수성)을
      # 기계로 강제한다. 이 저장소에서 규약이 갈라진 곳은 늘 기계가 안 보던 영역이었다.
      - run: npm run lint
      - run: npm run typecheck
      # ★e2e 파일 하나가 리스너를 여럿 띄운다. 코어 수만큼 병렬로 돌리면 소켓 경쟁으로
      # 간헐 실패가 나므로 CI에서는 낮춰 고정한다.
      - run: npm test -- --test-concurrency=2
      - run: npm run smoke

  # 자격증명이 이력에 들어왔는가. **지워진 커밋에 남은 것은 지워지지 않는다** —
  # 공개 저장소에서 한 번 밀린 값은 밀린 순간 이미 밖에 있다.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # 조직 소유 저장소는 gitleaks-action 라이선스가 필수다(개인 계정은 무료).
        # org 시크릿으로 둔다 — 다섯 저장소가 같은 값을 쓰고, 한 군데서만 돈다.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # **설정을 못 박는다.** 자동 탐지에 맡기면 `.gitleaks.toml` 이 안 읽혀도
          # 조용히 통과하고, 그러면 예외가 아니라 검사가 사라진 것을 통과로 읽는다.
          GITLEAKS_CONFIG: .gitleaks.toml

      # **두 번째 눈 — 이력 전체.** 위의 액션은 이벤트 범위만 본다(push 면 밀린 커밋,
      # PR 이면 PR 커밋). 그것만으로는 **이미 이력에 있는 것**을 다시 훑지 않는다 —
      # 새 규칙이 추가돼 어제까지 조용하던 옛 커밋이 오늘 걸리는 경우를 놓친다.
      #
      # 같은 스캐너를 범위만 달리해 한 번 더 돌린다. 둘 다 통과해야 한다.
      # `!cancelled()` 로 걸어 **위가 빨개져도 반드시 돈다** — 한쪽 실패가 다른 쪽 신호를
      # 가리면 무엇이 깨졌는지 한 번에 못 본다.
      #
      # ⚠️ 여기 버전·체크섬은 dependabot 이 못 갱신한다(URL 로 받는 파일이다).
      #    위 액션이 올라가는 PR 에서 이 두 줄도 같이 본다.
      - name: gitleaks (이력 전체)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # **워크플로 자체가 공격면이다.** 러너는 밖에서 온 코드를 실행하고, `${{ }}` 가
  # `run:` 본문에 박히면 그게 곧 셸 코드가 된다. 사람은 리뷰에서 반드시 놓친다.
  workflow-audit:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
          ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o /tmp/zizmor.tgz "$url"
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tgz" | sha256sum -c -
          tar xzf /tmp/zizmor.tgz -C /tmp
          /tmp/zizmor --no-progress --persona=regular .github/workflows

  # **PR 이 무엇을 끌고 들어오는지 본다.** `npm ci` 는 잠금 파일을 그대로 세우므로
  # CI 는 새로 들어온 패키지에 대해 아무 말도 하지 않는다 — 초록이 곧 "이 의존성이
  # 괜찮다" 로 읽히는 자리다.
  dependency-review:
    name: dependency review
    # PR 에서만 뜻이 있다. 기준점이 있어야 "무엇이 새로 들어왔는가" 를 물을 수 있다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # 무엇이 왜 막혔는지 PR 안에 적는다. 로그를 열어야만 알 수 있으면
      # 밖에서 온 기여자는 그냥 막혔다고만 느낀다.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # `moderate` 부터 막으면 전이 의존성의 소음에 파묻힌다. 막는 선은
          # **되돌릴 수 없는 것**에 맞춘다.
          fail-on-severity: high
          # 카피레프트를 거부한다. 정말 필요한 것이 걸리면 여기서 예외를 다는 대신
          # **왜 필요한지를 PR 에 적고** 이 줄을 고친다.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure

  # **브랜치 규칙이 거는 이름은 이것 하나다.**
  #
  # 잡 이름을 하나하나 나열하면 이름이 바뀌는 날 그 체크는 "존재하지 않는 체크" 가
  # 되고, 보호는 조용히 사라진다 — GitHub 은 그때 아무 말도 하지 않는다. 여기서
  # 모아 받으면 잡을 늘리고 줄이는 것이 `needs:` 한 줄로 끝나고, 보호 규칙은 안 건드린다.
  gate:
    name: gate
    needs: [verify, secret-scan, workflow-audit, dependency-review]
    # 선행 잡이 빨개도 이 잡은 돌아야 한다. 안 그러면 "돌지 않은 체크" 가 되어
    # 규칙이 기다리기만 하고, 무엇이 깨졌는지는 아무 데도 안 적힌다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 선행 잡 판정
        # `${{ }}` 를 `run:` 본문에 박지 않는다 — 그 자리는 셸이 스크립트를 보기 전에
        # 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸 코드가 된다.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          # `skipped` 는 통과로 본다 — 이 이벤트에 해당하지 않는 잡이 있다(예: PR 에서만
          # 뜻이 있는 의존성 리뷰). 건너뛴 것과 실패한 것은 다른 말이다.
          bad="$(jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length' <<<"$NEEDS")"
          test "$bad" = "0" || { echo "::error::선행 잡 $bad 개가 통과하지 않았다"; exit 1; }
          echo "게이트 통과"
