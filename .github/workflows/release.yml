# 릴리스 — **배포로 가는 유일한 출입구**
#
# 여기서만 배포가 시작된다. 배포 신호 잡(`deploy`)도 **이 파일 안에** 있다 — 배포에
# 닿는 워크플로가 이것 하나뿐이어야 검증을 건너뛴 배포 경로가 **구조적으로 존재하지 않는다.**
#
# ★예전엔 신호 잡을 `deploy.yml`(`workflow_call` 전용)로 떼어 두었다. 그런데 재사용
# 워크플로로 불린 잡에서는 `production` **환경 시크릿이 비어 있었다** — 환경은 붙고
# 승인까지 거쳤는데 `secrets.OPS_APP_ID`가 빈 문자열이었다(2026-09-30, 그 구조로 처음 배포를
# 시도한 날 두 번 재현). 일반 잡으로 옮기면 환경 시크릿이 그대로 풀린다. 부르는 쪽에서
# `secrets: inherit`을 하면 저장소 시크릿까지 통째로 넘어가므로 그 길은 택하지 않았다.
#
# 층이 셋이다. **사람의 의도**(수동 실행) → **기계의 검증**(main 인가 · gate 가
# 초록이었나 · 태그가 겹치지 않나) → **권한의 게이트**(`production` 환경의 승인과
# 시크릿). 수동 실행만으로는 첫째 층밖에 안 된다 — 쓰기 권한이 있는 토큰이면
# 누구나 이 워크플로를 부를 수 있다.

name: Release & deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리즈 태그 (예: v0.3.0). 비우면 날짜 기반으로 만든다"
        required: false
        type: string
      deploy:
        description: "라이브 배포까지 진행한다"
        type: boolean
        default: true

# 기본은 읽기만. 릴리스를 만드는 잡에서만 올린다.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 체크아웃이 남기는 자격증명을 `.git/config` 에 두지 않는다. 아래 단계는
          # 전부 `gh` 가 자기 토큰으로 하고, git 은 로컬 객체만 읽는다.
          persist-credentials: false

      - name: 브랜치 확인
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::main에서만 릴리즈한다 (현재: ${GITHUB_REF})" >&2
            exit 1
          fi

      # **이 커밋이 게이트를 통과한 적이 있는가.** 없으면 여기서 멈춘다 —
      # 검증되지 않은 커밋에 태그를 붙이면 그 태그가 거짓말을 한다.
      - name: gate 초록 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
                   --jq '[.check_runs[] | select(.name == "gate")]')
          total=$(echo "$runs" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "::error::이 커밋에서 gate 가 돈 적이 없다 — 검증 없이 릴리즈하지 않는다" >&2
            exit 1
          fi
          echo "$runs" | jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "-")"'
          bad=$(echo "$runs" | jq -r '[.[] | select(.conclusion != "success")] | length')
          if [ "$bad" -ne 0 ]; then
            echo "::error::gate 가 성공이 아니다 — ${bad}개 미통과" >&2
            exit 1
          fi
          echo "gate ${total}개 전부 success"

      - name: 태그 결정
        id: tag
        # `${{ }}` 를 `run:` 본문에 박지 않는다 — 그 자리는 셸이 스크립트를 보기 전에
        # 통째로 치환되므로, 값에 따옴표나 `$(...)` 가 섞이면 그대로 셸 코드가 된다.
        # 여기 오는 값은 사람이 폼에 직접 적는 문자열이다.
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          want="$WANT"
          if [ -z "$want" ]; then
            base="v$(date -u +%Y.%m.%d)"
            want="$base"
            n=1
            while git rev-parse -q --verify "refs/tags/$want" >/dev/null; do
              n=$((n+1)); want="${base}-${n}"
            done
          fi
          if git rev-parse -q --verify "refs/tags/$want" >/dev/null; then
            echo "::error::태그 $want 가 이미 있다 — 같은 이름으로 다시 릴리즈하지 않는다" >&2
            exit 1
          fi
          echo "tag=$want" >> "$GITHUB_OUTPUT"
          echo "릴리즈 태그: $want"

      - name: 릴리즈 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --generate-notes
          echo "릴리즈: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"

  # 배포 신호 — 운영 저장소에 "이 태그를 배포하라"는 repository_dispatch를 보낸다.
  # 실제 배포(SSH·호스트)는 운영 저장소가 한다(CLAUDE.md §릴리즈·배포).
  deploy:
    needs: release
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # **여기부터 되돌릴 수 없다.** 승인자·배포 브랜치 제한·시크릿이 붙는 자리다.
    #
    # ⚠️ `OPS_APP_ID` · `OPS_APP_PRIVATE_KEY` 는 **이 환경의 시크릿이어야 한다.**
    #    저장소 시크릿에 두면 이 저장소의 **어떤** 워크플로든 참조할 수 있다 —
    #    환경에 두면 이 잡에서만 보이고, 그 전에 환경의 승인을 거친다.
    environment:
      name: production
    steps:
      - name: 운영 저장소 이름 분리
        id: ops
        env:
          OPS_REPO: ${{ vars.OPS_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_REPO:-}" ]; then
            echo "::error::vars.OPS_REPO 가 비어 있다 — 어디로 신호를 보낼지 모른다." >&2
            exit 1
          fi
          echo "name=${OPS_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: 배포 신호용 토큰 발급
        id: ops_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          repositories: ${{ steps.ops.outputs.name }}
          permission-contents: write

      - name: 배포 신호 전송
        env:
          GH_TOKEN: ${{ steps.ops_token.outputs.token }}
          OPS_REPO: ${{ vars.OPS_REPO }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::설치 토큰을 받지 못했다 — 배포 신호를 못 보냈다." >&2
            exit 1
          fi
          jq -n --arg tag "$TAG" --arg sha "$SHA" \
            '{event_type:"deploy", client_payload:{tag:$tag, sha:$sha}}' \
            | gh api -X POST "repos/${OPS_REPO}/dispatches" --input -
          echo "배포 신호를 보냈다 — 진행 상황은 ops 저장소의 Actions에서 본다."

  # 릴리스는 만들어졌는데 신호만 실패한 경우를 사람이 알아야 한다.
  aftermath:
    needs: [release, deploy]
    if: ${{ always() && needs.release.result == 'success' && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "::warning::릴리즈 $TAG 는 만들어졌다. 배포 신호만 실패했다."
          echo "  운영 저장소에서 Deploy 워크플로를 이 태그로 수동 실행하면 된다."
