name: ionosphere

# ★**규칙을 끄지 않고 경로만 제외한다.**
#
# 첫 스캔에서 경보 36건 중 20건이 `js/disabling-certificate-validation`이었고, 그 20건이
# **전부** 테스트·프로브였다(자체서명 인증서로 리스너를 띄우고 붙는 코드다 — 그러라고 있는 것).
# 그 20건이 목록을 덮어 실제 코드의 15건이 묻혀 있었다. 신호를 가리는 잡음은 경보가 아니라
# 경보를 못 읽게 만드는 장애물이다.
#
# 규칙 자체를 끄는 선택지도 있었지만 그러면 **소스에서** 인증서 검증을 끄는 것까지 놓친다.
# 기회적 TLS(RFC 7435)라도 "어디서 어떤 조건으로 끄는가"가 요점이라, 그건 계속 봐야 한다.
paths-ignore:
  - "**/test/**"
