version: 2
updates:
  # ★GitHub Actions만 본다. npm은 일부러 뺐다 — 이 저장소의 규약이 "의존성 최소"이고
  # devDependency가 다섯 개뿐이라, 자동 PR이 주는 이득보다 소음이 크다. 대신 액션은
  # 참조가 이제 커밋 SHA 라 스스로는 절대 안 움직인다 — 움직여 주는 것이 여기뿐이다.
  # 낡은 액션은 공급망 문제로 직결되므로, 이 항목이 없으면 핀은 그냥 화석이 된다.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # init/analyze는 실행 중 같은 설정 파일을 공유하므로 버전이 갈리면 분석이 즉시 실패한다.
    # upload-sarif까지 같은 릴리즈 묶음으로 올려 CodeQL 액션 핀을 한 PR에서 관리한다.
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      # 이 저장소의 커밋 제목 규약(한국어 + 접두사)에 맞춘다.
      prefix: "정리"
